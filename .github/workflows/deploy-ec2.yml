name: Deploy to EC2

# Self-hosted production deploy: on every push to master, SSH into the EC2
# box, fast-forward the checkout, and re-run scripts/deploy-prod.sh in --ci
# mode (skips the interactive seed + DB-mode prompts; every safety check,
# backup, migration, and health-check step runs exactly as it does when the
# script is run manually).
#
# This does NOT replace Render — Render still auto-deploys on push to its
# tracked branch independently. This workflow only drives the self-hosted
# EC2 stack described in docker-compose.prod.yml.
#
# A second job (smoke-test) runs after `deploy` succeeds: it runs the
# Google-auth origin smoke test (apps/web/e2e/google-auth.spec.ts) against
# the live prod URL, on the GitHub Actions runner (not on the EC2 box) —
# catching the case where a prod domain change wasn't added to the Google
# OAuth client's "Authorized JavaScript origins" in Google Cloud Console.

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

# DOMAIN (repo variable, Settings → Secrets and variables → Actions →
# Variables) is passed straight into the smoke-test job below as `domain:`.
# Bare hostname, matching the DOMAIN convention used in .env.prod.example
# and scripts/deploy-prod.sh — not a full URL. Falls back to the current
# known prod domain if unset.

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No checkout step here — the code is pulled on the EC2 box itself via
      # git fetch/reset over SSH, not on the Actions runner.
      - name: SSH into EC2 and run deploy-prod.sh --ci
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            # NOTE: this path must match wherever the repo is actually
            # checked out on the EC2 box — update the secret/path below if
            # your deployment lives somewhere other than /home/ubuntu/travel.
            cd /home/ubuntu/travel
            git fetch origin master
            git reset --hard origin/master
            ./scripts/deploy-prod.sh --ci

  smoke-test:
    needs: deploy
    uses: ./.github/workflows/_smoke-test.yml
    with:
      domain: ${{ vars.DOMAIN || 'tripeeeh.com' }}
      report-name: prod
