<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" width="100%" height="100%">
  <defs>
    <!-- Vibrant Blue-to-Teal Ribbon Gradient -->
    <linearGradient id="main-cyan-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="50%" stop-color="#00C4D6" />
      <stop offset="100%" stop-color="#15E6C1" />
    </linearGradient>

    <!-- Text Gradient for "eee" -->
    <linearGradient id="eee-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8E8" />
      <stop offset="50%" stop-color="#00C4E6" />
      <stop offset="100%" stop-color="#14E5C0" />
    </linearGradient>

    <!-- Bright Orange Accent Gradient -->
    <linearGradient id="orange-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA800" />
      <stop offset="100%" stop-color="#FF5A00" />
    </linearGradient>

    <!-- Compass Dial Teal/Green Gradient -->
    <linearGradient id="compass-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C896" />
      <stop offset="100%" stop-color="#80E000" />
    </linearGradient>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ICON MARK -->
  <g id="icon" transform="translate(60, 40)">
    <!-- Back Orange Loop -->
    <path d="M 180 160 C 185 80, 235 80, 245 160 C 250 200, 230 220, 215 210" 
          fill="none" stroke="url(#orange-accent)" stroke-width="16" stroke-linecap="round"/>

    <!-- Outer Compass Ring -->
    <circle cx="100" cy="200" r="55" fill="none" stroke="url(#main-cyan-teal)" stroke-width="14"/>
    <!-- Inner Tick Marks -->
    <path d="M 100 152 L 100 158 M 100 242 L 100 248 M 52 200 L 58 200 M 142 200 L 148 200" 
          stroke="#00C896" stroke-width="3" stroke-linecap="round"/>

    <!-- Compass Pointer -->
    <polygon points="100,165 110,200 100,195" fill="url(#orange-accent)" />
    <polygon points="100,235 90,200 100,205" fill="#00A3E0" />
    <circle cx="100" cy="200" r="4" fill="#FFFFFF"/>

    <!-- Main Dynamic Winding Path / Road -->
    <path d="M 80 250 C 120 250, 140 190, 150 180 C 170 160, 155 260, 200 270 C 235 285, 220 180, 260 125" 
          fill="none" stroke="url(#main-cyan-teal)" stroke-width="18" stroke-linecap="round" filter="url(#soft-shadow)"/>

    <!-- Arrow Head -->
    <path d="M 245 135 L 275 115 L 273 150 Z" fill="#00A3E0" />

    <!-- North Star / Burst -->
    <g transform="translate(275, 55)">
      <path d="M 25 0 L 29 17 L 45 10 L 32 25 L 45 40 L 29 33 L 25 50 L 21 33 L 5 40 L 18 25 L 5 10 L 21 17 Z" fill="url(#main-cyan-teal)"/>
    </g>
  </g>

  <!-- TYPOGRAPHY -->
  <g id="text" transform="translate(410, 243)">
    <!-- Brand Name: tripeeeh -->
    <text font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="700" font-size="120" letter-spacing="-2">
      <tspan fill="#3A3D40">trip</tspan><tspan fill="url(#eee-gradient)">eee</tspan><tspan fill="#3A3D40">h</tspan>
    </text>
  </g>
</svg>
