<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-cyan-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="100%" stop-color="#15E6C1" />
    </linearGradient>

    <linearGradient id="fav-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA800" />
      <stop offset="100%" stop-color="#FF5A00" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="100" fill="#FFFFFF"/>

  <g transform="translate(45, 30) scale(1.35)">
    <!-- Orange Back Loop -->
    <path d="M 150 140 C 155 70, 205 70, 215 140" fill="none" stroke="url(#fav-orange)" stroke-width="20" stroke-linecap="round"/>

    <!-- Compass Ring -->
    <circle cx="85" cy="180" r="50" fill="none" stroke="url(#fav-cyan-teal)" stroke-width="18"/>
    <polygon points="85,145 93,180 85,175" fill="url(#fav-orange)" />
    <polygon points="85,215 77,180 85,185" fill="#00A3E0" />

    <!-- Main Path/Ribbon -->
    <path d="M 65 230 C 105 230, 125 170, 135 160 C 155 140, 140 240, 185 240 C 220 240, 200 140, 240 90" 
          fill="none" stroke="url(#fav-cyan-teal)" stroke-width="22" stroke-linecap="round"/>

    <!-- Arrow Head -->
    <path d="M 225 100 L 255 80 L 250 115 Z" fill="#00A3E0" />

    <!-- Star Burst -->
    <g transform="translate(245, 15)">
      <path d="M 20 0 L 24 13 L 36 8 L 26 20 L 36 32 L 24 27 L 20 40 L 16 27 L 4 32 L 14 20 L 4 8 L 16 13 Z" fill="url(#fav-cyan-teal)"/>
    </g>
  </g>
</svg>
